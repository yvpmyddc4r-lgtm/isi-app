<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prova vibrazione</title>
<style>
  body { margin: 0; padding: 20px 16px; background: #06301F; color: #EDE3C8; font-family: system-ui, sans-serif; text-align: center; }
  h1 { font-size: 22px; color: #E0C27A; margin: 6px 0 4px; }
  p { margin: 6px 0 16px; font-size: 15px; }
  .k { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; max-width: 360px; margin: 0 auto 18px; }
  button { font: inherit; font-size: 20px; height: 76px; border-radius: 10px; border: 1px solid #D4B86E; background: rgba(8,20,15,.72); color: #EDE3C8; }
  button:active { background: #132820; }
  #info { text-align: left; max-width: 360px; margin: 0 auto; font-size: 13px; line-height: 1.5; background: rgba(0,0,0,.25); padding: 10px 12px; border-radius: 8px; word-break: break-word; }
</style>
</head>
<body>
<h1>Prova vibrazione</h1>
<p>Premi i tasti uno alla volta e dimmi quali fanno tremare il telefono.</p>
<div class="k">
  <button data-ms="12">1 · cortissimo</button>
  <button data-ms="30">2 · corto</button>
  <button data-ms="60">3 · medio</button>
  <button data-ms="150">4 · lungo</button>
</div>
<div id="info"></div>
<script>
  var info = document.getElementById('info'), righe = [];
  var scrivi = function (t) { righe.push(t); info.innerHTML = righe.join('<br>'); };
  scrivi('Vibrazione disponibile: ' + (typeof navigator.vibrate === 'function' ? 'sì' : 'NO'));
  scrivi('Telefono e browser: ' + navigator.userAgent);
  scrivi('Aperta come app: ' + (matchMedia('(display-mode: standalone)').matches ? 'sì' : 'no'));
  document.querySelector('.k').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    var r = 'manca';
    try { if (typeof navigator.vibrate === 'function') r = navigator.vibrate(+b.dataset.ms) ? 'accettata' : 'rifiutata'; } catch (x) { r = 'errore'; }
    scrivi('Tasto ' + b.textContent + ': ' + r);
  });
</script>
</body>
</html>
